<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>田野语料工作台</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><h1>田野语料转写质检与发布工作台</h1><p>项目建档、授权片段、修订质检、专家复核和凭据发布</p></header>
<section><h2>项目状态总览</h2><form id="filters" class="filters"><select name="status"><option value="">全部项目状态</option><option value="draft">草稿</option><option value="ready">可发布</option><option value="frozen">已冻结</option></select><select name="ethicsStatus"><option value="">全部伦理状态</option><option value="pending">待审核</option><option value="approved">已批准</option><option value="restricted">受限</option></select><input name="ownerID" placeholder="负责人 ID"><button>刷新</button></form><div id="project-list" class="list" aria-live="polite"></div></section>
<section class="grid"><form id="project"><h2>创建语料项目</h2><input name="projectID" placeholder="项目 ID" required><input name="title" placeholder="项目标题" required><input name="languageVariant" placeholder="语言变体" required><input name="ownerID" placeholder="负责人 ID" required><input name="collectionSites" placeholder="采集地点（逗号分隔）" required><input name="consentRefs" placeholder="允许的 consentRef（逗号分隔）"><select name="ethicsStatus"><option value="pending">待审核</option><option value="approved">已批准</option><option value="restricted">受限</option></select><button>创建项目</button></form><div><h2>项目详情</h2><pre id="output">从总览选择项目以加载最新快照</pre></div></section>
</main><script src="/static/app.js"></script></body></html>
